<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>Sky Blaster</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>

<div id="gameContainer">

    <canvas id="game"></canvas>

    <div id="hud">
        <div>🏆 Score: <span id="score">0</span></div>
        <div>❤️ <span id="lives">3</span></div>
        <div>⭐ Best: <span id="best">0</span></div>
    </div>

    <div id="menu">

        <div class="panel">

            <h1>✈️ SKY BLASTER</h1>

            <p id="menuText">
                Destroy enemy aircraft!
            </p>

            <p>
                PC: WASD / Arrow Keys + Space
            </p>

            <p>
                Mobile: Touch and hold anywhere
            </p>

            <button id="startBtn">
                START GAME
            </button>

        </div>

    </div>

</div>

<script src="main.js"></script>

</body>
</html>
